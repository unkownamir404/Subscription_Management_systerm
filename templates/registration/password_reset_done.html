{% extends "base.html" %}

{% block title %}Reset Link Sent - Brightloop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 mt-5 text-center">
            <div class="card-body p-4">
                <div class="mb-3 text-success">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-envelope-check" viewBox="0 0 16 16">
                        <path d="M2 2a2 2 0 0 0-2 2v8.01A2 2 0 0 0 2 14h5.5a.5.5 0 0 0 0-1H2a1 1 0 0 1-.966-.741l5.64-3.471L8 9.583l7-4.321V4a1 1 0 0 0-1-1H2Zm3.708 6.208L1 11.105V5.383l4.708 2.825ZM1 4.217V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v.217l-7 4.2-7-4.2Z"/>
                        <path d="M16 12.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Zm-1.993-1.679a.5.5 0 0 0-.686.172l-1.17 1.95-.547-.547a.5.5 0 0 0-.708.708l1 1a.5.5 0 0 0 .752-.044l1.5-2.5a.5.5 0 0 0-.141-.739Z"/>
                    </svg>
                </div>
                <h4 class="card-title fw-bold mb-2">Check Your Email</h4>
                <p class="text-muted small mb-4">
                    If an account exists with the email you entered, we have sent instructions to reset your password. Please check your inbox and console.
                </p>
                <a href="{% url 'login' %}" class="btn btn-outline-primary w-100 py-2">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

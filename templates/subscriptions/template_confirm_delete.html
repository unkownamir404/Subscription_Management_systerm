{% extends "base.html" %}

{% block title %}Delete Template - Brightloop{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4 text-center">
      <div class="display-6 text-danger mb-3"><i class="bi bi-trash"></i></div>
      <h5 class="fw-bold">Delete Template?</h5>
      <p class="text-muted small">Are you sure you want to delete template <strong>{{ object.name }}</strong>? Existing subscriptions will remain untouched.</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-2 mt-4">
          <a href="/templates/" class="btn btn-outline-secondary">Cancel</a>
          <button type="submit" class="btn btn-danger">Confirm Delete</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
